<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loan Manager — Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Apply a saved theme before first paint (no light flash on reload).
    // With nothing saved, no attribute is set and CSS follows the OS
    // preference. Kept in sync with ThemeService (key: 'lm-theme').
    try {
      var t = localStorage.getItem('lm-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
