<h2 class="dialog-title">Add loan</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
  <mat-form-field appearance="outline">
    <mat-label>Customer</mat-label>
    <mat-select formControlName="customerId">
      <mat-option *ngFor="let c of customers" [value]="c.customerId">{{ c.fullName }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Principal amount</mat-label>
    <input matInput type="number" formControlName="principal" min="1" />
  </mat-form-field>

  <div class="dialog-form__actions">
    <button type="button" mat-stroked-button (click)="cancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || submitting">Add loan</button>
  </div>
</form>
