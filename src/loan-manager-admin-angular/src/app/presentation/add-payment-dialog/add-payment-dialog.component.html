<h2 class="dialog-title">{{ editing ? 'Edit payment' : 'Record a payment' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
  <mat-form-field appearance="outline">
    <mat-label>Amount paid</mat-label>
    <span matTextPrefix>₱&nbsp;</span>
    <input matInput type="number" formControlName="amountPaid" />
    <mat-hint>Outstanding balance: ₱{{ data.balance | number }}</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Payment method</mat-label>
    <mat-select formControlName="paymentMethod">
      <mat-option value="cash">Cash</mat-option>
      <mat-option value="gcash">GCash</mat-option>
      <mat-option value="bank_transfer">Bank transfer</mat-option>
      <mat-option value="other">Other</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Reference number (optional)</mat-label>
    <input matInput formControlName="referenceNumber" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Notes (optional)</mat-label>
    <textarea matInput formControlName="notes" rows="2"></textarea>
  </mat-form-field>

  <div class="dialog-form__actions">
    <button type="button" mat-stroked-button (click)="cancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || submitting">
      {{ editing ? 'Save changes' : 'Record payment' }}
    </button>
  </div>
</form>
