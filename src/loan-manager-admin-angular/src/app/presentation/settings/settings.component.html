<section *ngIf="authService.hasRole('admin')" class="settings-section">
  <mat-card class="table-card">
    <div class="table-card__header">
      <div>
        <h2>Users</h2>
        <p>Everyone with access to this admin panel</p>
      </div>
      <button mat-flat-button color="primary" (click)="openAddUser()">
        <mat-icon>person_add</mat-icon>
        Add user
      </button>
    </div>

    <p class="users-error" *ngIf="usersError">{{ usersError }}</p>

    <div class="table-toolbar">
      <div class="filter-pills">
        <button
          type="button"
          class="filter-pill"
          [class.filter-pill--active]="statusFilter === 'all'"
          (click)="setStatusFilter('all')"
        >All</button>
        <button
          type="button"
          class="filter-pill"
          [class.filter-pill--active]="statusFilter === 'active'"
          (click)="setStatusFilter('active')"
        >Active</button>
        <button
          type="button"
          class="filter-pill"
          [class.filter-pill--active]="statusFilter === 'inactive'"
          (click)="setStatusFilter('inactive')"
        >Inactive</button>
      </div>

      <div class="search-box">
        <mat-icon>search</mat-icon>
        <input type="text" [(ngModel)]="searchTerm" placeholder="Search users…" aria-label="Search users" />
      </div>
    </div>

    <div class="table-scroll">
      <table mat-table [dataSource]="filteredUsers" class="users-table">
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>User</th>
          <td mat-cell *matCellDef="let u">
            <div class="user-cell">
              <span class="avatar">{{ getInitials(u.username) }}</span>
              <span class="user-cell__name">{{ u.username }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let u">
            <mat-select
              class="role-select"
              [ngClass]="'role-select--' + u.role"
              [value]="u.role"
              (selectionChange)="changeRole(u, $event.value)"
              [attr.aria-label]="'Change role for ' + u.username"
            >
              <mat-option value="admin">Admin</mat-option>
              <mat-option value="staff">Staff</mat-option>
            </mat-select>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let u">
            <span class="chip" [ngClass]="'chip--' + u.status">{{ u.status }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let u" class="mono">{{ u.createdAt | date:'MM/dd/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let u">
            <button
              mat-icon-button
              *ngIf="u.status === 'active' && !isSelf(u)"
              (click)="deactivate(u)"
              [attr.aria-label]="'Deactivate ' + u.username"
              matTooltip="Deactivate user"
            >
              <mat-icon>person_off</mat-icon>
            </button>
            <button
              mat-icon-button
              *ngIf="u.status === 'inactive'"
              (click)="activate(u)"
              [attr.aria-label]="'Activate ' + u.username"
              matTooltip="Activate user"
            >
              <mat-icon>person</mat-icon>
            </button>
            <button
              mat-icon-button
              (click)="openResetPassword(u)"
              [attr.aria-label]="'Reset password for ' + u.username"
              matTooltip="Reset password"
            >
              <mat-icon>lock_reset</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <p class="empty-hint" *ngIf="users.length === 0">No users yet.</p>
    <p class="empty-hint" *ngIf="users.length > 0 && filteredUsers.length === 0">No users match this filter.</p>
  </mat-card>
</section>
