<h2 class="dialog-title">Edit loan</h2>
<p class="dialog-subtitle">Loan <span class="mono">{{ data.loan.loanNumber }}</span></p>

<form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
  <mat-form-field appearance="outline">
    <mat-label>Loan date</mat-label>
    <input matInput type="date" formControlName="startDate" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Due date</mat-label>
    <input matInput type="date" formControlName="dueDate" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Interest rate</mat-label>
    <input matInput type="number" formControlName="interestRatePercent" step="0.1" />
    <span matTextSuffix>&nbsp;%</span>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Interest amount</mat-label>
    <span matTextPrefix>₱&nbsp;</span>
    <input matInput type="number" formControlName="interestAmount" />
    <mat-hint>Direct override — not recalculated from the rate above. Use this for a goodwill discount.</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Remarks</mat-label>
    <textarea matInput formControlName="remarks" rows="2"></textarea>
  </mat-form-field>

  <div class="dialog-form__actions">
    <button type="button" mat-stroked-button (click)="cancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || submitting">Save changes</button>
  </div>
</form>
