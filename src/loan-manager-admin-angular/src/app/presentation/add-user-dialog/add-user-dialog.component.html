<h2 class="dialog-title">Add user</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
  <mat-form-field appearance="outline">
    <mat-label>Username</mat-label>
    <input matInput formControlName="username" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" />
    <mat-hint>At least 8 characters</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Role</mat-label>
    <mat-select formControlName="role">
      <mat-option value="admin">Admin</mat-option>
      <mat-option value="staff">Staff</mat-option>
    </mat-select>
  </mat-form-field>

  <p class="dialog-form__error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="dialog-form__actions">
    <button type="button" mat-stroked-button (click)="cancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || submitting">Add user</button>
  </div>
</form>
