<div
  class="shell"
  [class.collapsed]="railCollapsed()"
  [class.mobile-nav-open]="mobileNavOpen()"
>
  <div class="sidebar-backdrop" *ngIf="mobileNavOpen()" (click)="closeMobileNav()"></div>

  <aside class="sidebar" id="lm-sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"><mat-icon>account_balance</mat-icon></span>
      <span class="brand__text">
        <b>Loan<span class="brand__accent">Manager</span></b>
        <small>Lending administration</small>
      </span>
    </div>

    <nav class="nav-scroll">
      <ng-container *ngFor="let section of navSections">
        <div class="nav-title">{{ section.title }}</div>
        <a
          *ngFor="let item of section.items"
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [matTooltip]="item.label"
          matTooltipPosition="right"
          [matTooltipDisabled]="!railCollapsed()"
          (click)="closeMobileNav()"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span class="nav-link__label">{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>

    <div class="sidebar-foot">
      <div class="workspace">
        <span class="workspace__avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="workspace__text">
          <b>{{ authService.username() }}</b>
          <small>{{ authService.role() }}</small>
        </span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="iconbtn"
        aria-controls="lm-sidebar"
        [attr.aria-expanded]="isMobile() ? mobileNavOpen() : !collapsed()"
        [attr.aria-label]="isMobile() ? 'Toggle navigation menu' : (collapsed() ? 'Expand navigation' : 'Collapse navigation')"
        [matTooltip]="isMobile() ? 'Menu' : (collapsed() ? 'Expand navigation' : 'Collapse navigation')"
        (click)="toggleNav()"
      >
        <mat-icon>{{ !isMobile() && !collapsed() ? 'menu_open' : 'menu' }}</mat-icon>
      </button>

      <nav class="crumbs" aria-label="Breadcrumb">
        <span class="crumbs__section">{{ sectionTitle() }}</span>
        <span class="crumbs__sep" aria-hidden="true">/</span>
        <h1 class="crumbs__current" aria-current="page">{{ pageTitle() }}</h1>
      </nav>

      <div class="top-right">
        <button type="button" class="iconbtn" aria-label="Search" matTooltip="Search">
          <mat-icon>search</mat-icon>
        </button>
        <button
          type="button"
          class="iconbtn"
          [attr.aria-label]="theme.effective() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          [matTooltip]="theme.effective() === 'dark' ? 'Light mode' : 'Dark mode'"
          (click)="theme.toggle()"
        >
          <mat-icon>{{ theme.effective() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
        <button
          type="button"
          class="iconbtn badge-anchor"
          aria-label="Notifications, 3 new"
          matTooltip="Notifications"
        >
          <mat-icon>notifications_none</mat-icon>
          <span class="badge-counter badge-counter--danger badge-counter--floating" aria-hidden="true">3</span>
        </button>

        <button
          type="button"
          class="acct"
          [matMenuTriggerFor]="userMenu"
          [attr.aria-label]="'Account menu for ' + (authService.username() ?? 'user')"
        >
          <span class="userpic" aria-hidden="true">{{ initials() }}</span>
          <span class="acct__text">
            <b>{{ authService.username() }}</b>
            <small>{{ authService.role() }}</small>
          </span>
          <mat-icon class="acct__chevron" aria-hidden="true">expand_more</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="acct-h">
            <b>{{ authService.username() }}</b>
            <span class="acct-h__role">{{ authService.role() }}</span>
          </div>
          <button mat-menu-item (click)="openChangeMyPassword()">
            <mat-icon>lock_reset</mat-icon>
            <span>Change password</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sign out</span>
          </button>
        </mat-menu>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
