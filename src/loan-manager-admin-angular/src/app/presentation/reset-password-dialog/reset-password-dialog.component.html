<h2 class="dialog-title">Reset password for {{ data.username }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
  <mat-form-field appearance="outline">
    <mat-label>New password</mat-label>
    <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
    <mat-hint>At least 8 characters</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Confirm new password</mat-label>
    <input matInput type="password" formControlName="confirmNewPassword" autocomplete="new-password" />
  </mat-form-field>

  <p class="dialog-form__error" *ngIf="form.errors?.['passwordsMismatch'] && form.get('confirmNewPassword')?.dirty">
    New passwords don't match.
  </p>
  <p class="dialog-form__error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="dialog-form__actions">
    <button type="button" mat-stroked-button (click)="cancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || submitting">
      {{ submitting ? 'Resetting…' : 'Reset password' }}
    </button>
  </div>
</form>
