<h2 class="dialog-title">{{ editing ? 'Edit extension' : 'Extend loan' }}</h2>
<p class="dialog-subtitle">Current due date: <span class="mono">{{ data.currentDueDate }}</span></p>

<form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
  <mat-form-field appearance="outline">
    <mat-label>Extension (days)</mat-label>
    <input matInput type="number" formControlName="extensionDays" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Additional charges</mat-label>
    <input matInput type="number" formControlName="additionalChargesAmount" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Remarks</mat-label>
    <textarea matInput formControlName="remarks" rows="2" placeholder="Reason for the extension"></textarea>
  </mat-form-field>

  <div class="dialog-form__actions">
    <button type="button" mat-stroked-button (click)="cancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || submitting">
      {{ editing ? 'Save changes' : 'Extend loan' }}
    </button>
  </div>
</form>
