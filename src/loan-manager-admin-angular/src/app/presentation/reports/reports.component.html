<mat-card class="table-card available-reports-card">
  <div class="table-card__header">
    <h2>Available Reports</h2>
    <p>Detailed, exportable reports beyond quick summaries</p>
  </div>
  <button class="report-link" (click)="router.navigate(['/reports/interest-earned'])">
    <mat-icon>trending_up</mat-icon>
    <span class="report-link__text">
      <span class="report-link__title">Interest Earned Report</span>
      <span class="report-link__sub">Elapsed-time interest earned by period, with per-loan drill-down</span>
    </span>
    <mat-icon class="report-link__arrow">arrow_forward</mat-icon>
  </button>
</mat-card>
